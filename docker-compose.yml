services:
  server:
    container_name: challengefit-server
    build: ./server
    expose:
      - "3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://user:password@db:5432/challengefit
      - NODE_ENV=production
    depends_on:
      - db
    networks:
      - proxy
      - internal

  db:
    container_name: challengefit-db
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=challengefit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  postgres_data:

networks:
  proxy:
    external: true
  internal:
    driver: bridge